name: E2E

# The whole pipeline on the sample projects in e2e/projects, with the recorded stand-in for claude (no API key).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: End-to-end checks
        run: npm run e2e
        env:
          E2E_JOBS: 3
